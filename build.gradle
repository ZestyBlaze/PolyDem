plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	maven {
		name = "Polyme"
		url = "https://maven.nucleoid.xyz"
	}
	maven {
		name = "FzzyMaven"
		url = "https://maven.fzzyhmstrs.me/"
	}
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven/"
	}
}

loom {
	accessWidenerPath = file("src/main/resources/demeter.classtweaker")
}

fabricApi {
	configureDataGeneration {
		client = true
		modId = "demeter"
	}
}

dependencies {
	minecraft ("com.mojang:minecraft:${project.minecraft_version}")
	implementation ("net.fabricmc:fabric-loader:${project.loader_version}")
	implementation ("net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}")

	implementation ("eu.pb4:booklet:${project.booklet_version}+${project.minecraft_version}")
	implementation ("eu.pb4:polymer-core:${project.polymer_version}+${project.minecraft_version}")
	implementation ("eu.pb4:polymer-blocks:${project.polymer_version}+${project.minecraft_version}")
	implementation ("eu.pb4:polymer-resource-pack:${project.polymer_version}+${project.minecraft_version}")
	implementation ("eu.pb4:polymer-virtual-entity:${project.polymer_version}+${project.minecraft_version}")
	implementation ("eu.pb4:polymer-resource-pack-extras:${project.polymer_version}+${project.minecraft_version}")

	implementation include("eu.pb4:sidebar-api:0.6.0+26.1")
	implementation include("eu.pb4:trinkets:${trinkets_version}+${project.minecraft_version}")

	implementation ("me.fzzyhmstrs:fzzy_config:${project.config_version}+${project.minecraft_version}")

	implementation include("eu.pb4:factorytools:${factorytools_version}+${project.minecraft_version}")
	implementation include("eu.pb4:sgui:${project.sgui_version}+${project.minecraft_version}")

	compileOnly ("maven.modrinth:polydex:${project.polydex_version}")
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}